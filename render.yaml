services:
  - type: web
    name: chwiyakhaenne-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: CHWIYAKHAENNE_CORS_ALLOWED_ORIGINS
        sync: false
